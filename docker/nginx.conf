user  nginx;
worker_processes  auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  upstream backend_upstream  { server backend:8080; }
  upstream keycloak_upstream { server keycloak:8081; }

  server {
    listen 8082;
    server_name _;

    location /nginx/health { return 200 "OK"; add_header Content-Type text/plain; }

    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri /index.html; }

    location /api/ {
      proxy_pass http://backend_upstream/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Must match spring.servlet.multipart.max-request-size in the backend (nginx default: 1m)
      client_max_body_size 20m;
    }

    # Reactions LSP WebSocket → backend:8080/lsp
    location /lsp {
      proxy_pass http://backend_upstream/lsp;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # OCL LSP WebSocket → backend:8080/ocl-lsp
    location /ocl-lsp {
      proxy_pass http://backend_upstream/ocl-lsp;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # The collaboration server's internal endpoints (e.g. POST /internal/projects/{id}/reload) are
    # only for the backend, which calls collaboration:1234 directly; never expose them.
    location /collaboration/internal/ { return 404; }

    # Collaboration WebSocket → collaboration:1234, without the /collaboration prefix
    location /collaboration/ {
      # The user's access token is in the query string (?token=...), so these requests aren't logged.
      access_log off;
      # A resolver and a variable instead of an upstream block: the name is looked up per request,
      # so nginx starts and keeps serving the app while the collaboration container is down (those
      # requests get 502). With a variable, proxy_pass doesn't strip the prefix, so rewrite does.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $collaboration_upstream collaboration:1234;
      rewrite ^/collaboration/(.*)$ /$1 break;
      proxy_pass http://$collaboration_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /realms/ {
      proxy_pass http://keycloak_upstream/realms/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
